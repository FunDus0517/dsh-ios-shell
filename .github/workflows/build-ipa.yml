name: build-ipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project DSHShell.xcodeproj \
            -target DSHShell \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/DSHShell.app"
          test -d "$APP"
          rm -rf Payload DSHShell.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DSHShell.ipa Payload
          ls -lh DSHShell.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DSHShell-unsigned-ipa
          path: DSHShell.ipa
          if-no-files-found: error

      # 额外发一份 Release 附件：公开仓库的 release 资产无需登录即可下载，
      # 这样即使 github.com 被墙也能从 objects.githubusercontent.com 取到 IPA
      - name: Publish release asset
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build DSHShell.ipa \
            --title "DSHShell unsigned IPA (latest build)" \
            --notes "Unsigned IPA built by GitHub Actions. Sideload with Sideloadly/AltStore (re-sign with your own Apple ID)."
        env:
          GH_TOKEN: ${{ github.token }}