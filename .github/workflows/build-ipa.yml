name: build-ipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -d DSHShell.xcodeproj
          xcodebuild -list -project DSHShell.xcodeproj

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project DSHShell.xcodeproj \
            -target DSHShell \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "DSHShell.app" -path "*Release-iphoneos*" | head -1)
          echo "APP=$APP"
          test -n "$APP"
          test -d "$APP"
          rm -rf Payload DSHShell.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DSHShell.ipa Payload
          ls -lh DSHShell.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DSHShell-unsigned-ipa
          path: DSHShell.ipa
          if-no-files-found: error

      - name: Publish release asset
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build DSHShell.ipa \
            --title "DSHShell unsigned IPA (latest build)" \
            --notes "Unsigned IPA built by GitHub Actions. Sideload with Sideloadly/AltStore."
        env:
          GH_TOKEN: ${{ github.token }}